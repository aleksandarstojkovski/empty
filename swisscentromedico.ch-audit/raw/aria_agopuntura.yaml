- main:
  - paragraph: Agopuntura e medicina tradizionale cinese
  - heading "Agopuntura a Lugano" [level=1]
  - paragraph: Dott. med. univ. Zeljko Djordjevic, Specialista in Medicina Fisica e Riabilitazione FMH. Swiss Centro Medico, Lugano. Pagina verificata dal medico, aggiornata il 18 settembre 2026.
  - paragraph: Agopuntura eseguita da medico specialista, con diagnosi occidentale e valutazione secondo la medicina tradizionale cinese. Trattiamo dolore cronico, cefalee, disturbi articolari e funzionali, con aghi o con laser.
  - list:
    - listitem: Agopuntura classica del corpo, addominale, auricolare RAC e laser-agopuntura
    - listitem: Qualifica in agopuntura e farmacoterapia cinese (ASA)
    - listitem: Attestato di agopuntura addominale (metodo Bo Zhiyun), 1° livello, Istituto Paracelso di Roma
    - listitem: Aghi sterili monouso
  - link "Prenota online":
    - /url: /prenota/
  - link "Chiama lo studio":
    - /url: tel:+41919210427
  - img "Seduta di agopuntura con aghi sulla schiena"
