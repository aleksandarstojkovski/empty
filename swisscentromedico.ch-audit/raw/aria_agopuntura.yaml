      - listitem:
        - text: Linde K, et al. Acupuncture for the prevention of tension-type headache. Cochrane Database Syst Rev. 2016;(4):CD007587.
        - link "doi:10.1002/14651858.CD007587.pub2":
          - /url: https://doi.org/10.1002/14651858.CD007587.pub2
      - listitem:
        - text: "Vickers AJ, et al. Acupuncture for Chronic Pain: Update of an Individual Patient Data Meta-Analysis. J Pain. 2018;19:455–474."
        - link "doi:10.1016/j.jpain.2017.11.005":
          - /url: https://doi.org/10.1016/j.jpain.2017.11.005
      - listitem:
        - text: "Witt CM, et al. Safety of acupuncture: results of a prospective observational study with 229,230 patients and introduction of a medical information and consent form. Forsch Komplementmed. 2009;16:91–97."
        - link "doi:10.1159/000209315":
          - /url: https://doi.org/10.1159/000209315
  - region "Non è sicuro quale trattamento fa per lei?":
    - heading "Non è sicuro quale trattamento fa per lei?" [level=2]
    - paragraph: Per il dolore muscolo-scheletrico lo studio segue più vie, spesso combinate. La visita specialistica, con l'ecografia quando serve, chiarisce quale è indicata nel suo caso.
    - heading "Reumatologia →" [level=3]:
      - link "Reumatologia →":
        - /url: /reumatologo/
    - paragraph: "Diagnosi e piano di cura: la prima visita quando il dolore è alle articolazioni, alla schiena o ai tendini."
    - heading "Interventistica del dolore →" [level=3]:
      - link "Interventistica del dolore →":
        - /url: /terapia-interventistica-del-dolore/
    - paragraph: Infiltrazioni ecoguidate di articolazioni e tessuti molli, con acido ialuronico o PRP quando indicato.
    - heading "PRP per articolazioni e tendini →" [level=3]:
      - link "PRP per articolazioni e tendini →":
        - /url: /il-plasma-ricco-di-piastrine-o-trombociti-prp/
    - paragraph: Plasma preparato dal sangue del paziente e iniettato in tendini e articolazioni.
    - heading "Laserterapia →" [level=3]:
      - link "Laserterapia →":
        - /url: /laserterapia/
    - paragraph: Luce laser locale, intra-articolare o endovenosa, senza farmaci.
  - paragraph: Le informazioni di questa pagina hanno finalità divulgativa e non sostituiscono la consulenza medica. L'indicazione, i benefici attesi e i rischi di ogni trattamento vengono valutati individualmente nel corso della visita specialistica.
