  - region "Quando l'agopuntura può aiutare":
    - heading "Quando l'agopuntura può aiutare" [level=2]
    - heading "Dolore muscolo-scheletrico" [level=3]
    - list:
      - listitem: Lombalgia e sciatalgia, cervicalgia, dorsalgia
      - listitem: Artrosi di ginocchio, anca, mano e spalla
      - listitem: "Tendinopatie: gomito del tennista, spalla, tendine d'Achille"
      - listitem: Dolore miofasciale, fibromialgia, esiti di colpo di frusta
    - heading "Disturbi funzionali" [level=3]
    - list:
      - listitem: Cefalea tensiva ed emicrania
      - listitem: Disturbi del sonno, stress, stati di tensione
      - listitem: Rinite allergica e disturbi delle vie respiratorie
      - listitem: Disturbi digestivi, nausea, dismenorrea
    - heading "Nervi e organi interni" [level=3]
    - list:
      - listitem: Nevralgia del trigemino, paresi facciale e altri disturbi dei nervi
      - listitem: Stomaco nervoso, reflusso, gastrite e disturbi intestinali
      - listitem: Allergie e disturbi di occhi, orecchie, pelle e vescica
      - listitem: Disturbi del cuore e della circolazione
    - heading "Come supporto alle cure" [level=3]
    - list:
      - listitem: Ansia, depressione, esaurimento e burnout, disturbi psicosomatici
      - listitem: Disturbi ginecologici, gravidanza e puerperio
      - listitem: Sovrappeso, diabete non insulino-dipendente, disturbi della tiroide
      - listitem: Smettere di fumare o di bere, desiderio di un figlio, terapie oncologiche e chemioterapia, difese immunitarie e vitalità
    - paragraph: L'agopuntura viene integrata nel percorso terapeutico quando l'indicazione clinica è chiara e, quando utile, combinata con medicina manuale, infiltrazioni ecoguidate o laserterapia.
  - region "Le tecniche che utilizziamo":
    - heading "Le tecniche che utilizziamo" [level=2]
    - heading "Agopuntura classica del corpo →" [level=3]:
      - link "Agopuntura classica del corpo →":
        - /url: /agopuntura-classica-del-corpo-con-aghi-o-laser/
    - paragraph: Inserimento di aghi sterili monouso nei punti selezionati dopo la valutazione MTC. In genere ben tollerata.
    - heading "Agopuntura auricolare RAC →" [level=3]:
      - link "Agopuntura auricolare RAC →":
        - /url: /agopuntura-auricolare-rac/
    - paragraph: "Auricolomedicina con controllo del riflesso auricolo-cardiaco: punti individuati sul padiglione auricolare, utile nel dolore cronico e nelle dipendenze. Anche con aghi riassorbibili a lunga durata."
    - heading "Laser-agopuntura non invasiva →" [level=3]:
      - link "Laser-agopuntura non invasiva →":
        - /url: /laserterapia-locale-non-invasiva-e-lagopuntura/
    - paragraph: "Fino a dodici laserneedle appoggiati sulla pelle stimolano più punti contemporaneamente. Indolore e senza aghi: adatta a chi non li tollera e ai pazienti più giovani."
    - heading "Agopuntura addominale →" [level=3]:
      - link "Agopuntura addominale →":
        - /url: /agopuntura-addominale/
    - paragraph: Aghi sottili in punti dell'addome, secondo il metodo del prof. Bo Zhiyun. Il medico ha l'attestato di 1° livello dell'Istituto Paracelso di Roma.
    - heading "Combinazione con la terapia del dolore →" [level=3]:
      - link "Combinazione con la terapia del dolore →":
        - /url: /reumatologo/
    - paragraph: Quando serve, l'agopuntura si affianca a medicina manuale, infiltrazioni ecoguidate e laserterapia nello stesso percorso.
  - 'region "Agopuntura e medicina tradizionale cinese (MTC): come lavoriamo"':
    - paragraph: Medicina tradizionale cinese
    - 'heading "Agopuntura e medicina tradizionale cinese (MTC): come lavoriamo" [level=2]'
    - paragraph: Prima di ogni seduta il Dott. Djordjevic esegue una valutazione secondo i principi della medicina tradizionale cinese, per individuare i punti più indicati al suo caso; la stessa lettura guida anche l'agopuntura auricolare RAC.
    - paragraph: "Il trattamento è l'agopuntura: con aghi sterili monouso, con il laser senza aghi o sul padiglione auricolare. La tecnica si sceglie in visita, insieme."
  - region "Dalla prima visita al ciclo di sedute":
    - paragraph: Il percorso
    - heading "Dalla prima visita al ciclo di sedute" [level=2]
    - list:
      - listitem:
        - heading "Visita specialistica" [level=3]
        - paragraph: Anamnesi, esame clinico e, se indicata, ecografia muscolo-scheletrica per chiarire l'origine del dolore.
      - listitem:
        - heading "Valutazione MTC" [level=3]
        - paragraph: "Lettura secondo la medicina tradizionale cinese e scelta dei punti e della tecnica più adatta: la valutazione e l'inserimento degli aghi li eseguo personalmente, in studio."
      - listitem:
        - heading "Ciclo di trattamento" [level=3]
        - paragraph: Il numero di sedute dipende dal disturbo e viene definito in visita, con rivalutazione periodica dei risultati.
      - listitem:
        - heading "Mantenimento" [level=3]
        - paragraph: Sedute di richiamo e indicazioni di esercizio o fitoterapiche per consolidare il beneficio.
    - img "Agopuntura auricolare sul padiglione dell'orecchio"
  - region "Cosa dicono gli studi":
    - heading "Cosa dicono gli studi" [level=2]
    - paragraph: Revisione Cochrane 2016 · 22 studi, 4985 persone
    - heading "Emicrania" [level=3]
    - paragraph: Attacchi almeno dimezzati in 41 pazienti su 100 dopo l'agopuntura, contro 17 su 100 senza agopuntura.
    - paragraph: Revisione Cochrane 2016 · 12 studi, 2349 persone
    - heading "Cefalea tensiva" [level=3]
    - paragraph: Nel più grande studio della revisione, mal di testa almeno dimezzati in 48 pazienti su 100, contro 19 su 100 con le cure abituali.
    - paragraph: Meta-analisi, Journal of Pain 2018 · 39 studi, 20 827 pazienti
    - heading "Dolore cronico" [level=3]
    - paragraph: "Schiena, collo, artrosi, spalla e mal di testa cronico: l'agopuntura riduce il dolore più dell'assenza di trattamento e dell'agopuntura simulata. Dopo un anno l'effetto cala solo di circa il 15%."
  - region "È sicura?":
    - heading "È sicura?" [level=2]
    - paragraph: In uno studio su 229 230 pazienti trattati da medici, 8,6 su 100 hanno riportato almeno un effetto indesiderato, più spesso un piccolo sanguinamento o un livido nel punto dell'ago. Le complicazioni serie sono state rarissime.
    - heading "Lo dica al medico se" [level=3]
    - list:
      - listitem: prende anticoagulanti
      - listitem: è incinta o pensa di esserlo
      - listitem: ha un pacemaker
      - listitem: "ha paura degli aghi: c'è il laser"
  - region "Domande frequenti":
    - heading "Domande frequenti" [level=2]
    - heading "L'agopuntura è dolorosa?" [level=3]
    - paragraph: "Gli aghi sono molto sottili e sterili monouso: la sensazione più comune è un formicolio o un senso di peso locale. L'agopuntura si sceglie dopo la visita specialistica e la valutazione secondo la medicina tradizionale cinese. Per chi preferisce evitare gli aghi, o per i pazienti più giovani, esiste la laser-agopuntura: fino a dodici laserneedle appoggiati sulla pelle, indolore e senza puntura. Lo dica in visita se ha paura degli aghi, se prende anticoagulanti, se è incinta o se ha un pacemaker."
    - heading "Quante sedute servono?" [level=3]
    - paragraph: Dipende dal disturbo e dalla sua durata. Il percorso inizia con la visita specialistica (anamnesi, esame clinico e, se indicata, ecografia muscolo-scheletrica), poi la valutazione secondo la medicina tradizionale cinese e la scelta dei punti e della tecnica. Il ciclo si definisce in visita, con rivalutazione periodica; in seguito si possono prevedere sedute di richiamo e indicazioni di esercizio per consolidare il beneficio.
    - heading "L'agopuntura è rimborsata dall'assicurazione?" [level=3]
    - paragraph:
      - text: "Lo studio è certificato RME e in Ticino fattura alle assicurazioni complementari: con una complementare, a determinate condizioni, il trattamento può essere rimborsato. Chi ha solo l'assicurazione di base riceve in visita un preventivo chiaro e paga direttamente. Per l'agopuntura il medico è inoltre riconosciuto da Visana (numero RCC V272164, verificabile nella"
      - link "lista terapeuti Visana":
        - /url: https://entry.visana.ch/b2a/apps/saa/therapists/
      - text: "): chi ha un'assicurazione complementare Visana per la medicina complementare può ottenere il rimborso secondo il proprio contratto."
    - heading "Serve una prescrizione del medico di famiglia?" [level=3]
    - paragraph: No, può prenotare direttamente. Se è già seguito da altri specialisti, portare referti e immagini aiuta a impostare subito il trattamento.
    - heading "Il laser funziona come gli aghi?" [level=3]
    - paragraph: "Stimola gli stessi punti senza pungere. Gli studi sul laser sono meno numerosi di quelli sugli aghi: è una buona alternativa per chi non tollera l'ago, da scegliere insieme in visita."
    - heading "Posso fare agopuntura se prendo farmaci?" [level=3]
    - paragraph: "Di solito sì: l'agopuntura si affianca alle cure. Porti l'elenco dei farmaci alla prima visita e non sospenda nessuna terapia senza parlarne con il medico."
    - heading "Cosa porto alla prima visita?" [level=3]
    - paragraph: "Referti ed esami recenti, l'elenco dei farmaci e, se ce l'ha, la tessera della cassa malati. Abiti comodi aiutano. Se è già seguito da altri specialisti, portare immagini e referti aiuta a impostare subito il trattamento. Non serve una prescrizione del medico di famiglia: si può prenotare direttamente."
    - heading "Si può combinare con altre terapie?" [level=3]
    - paragraph: Sì. L'agopuntura viene spesso integrata con medicina manuale, laserterapia e terapia interventistica del dolore all'interno dello stesso percorso.
  - region "Fonti scientifiche":
    - heading "Fonti scientifiche" [level=2]
    - list:
      - listitem:
        - text: Linde K, et al. Acupuncture for the prevention of episodic migraine. Cochrane Database Syst Rev. 2016;(6):CD001218.
