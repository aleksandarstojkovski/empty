- main:
  - paragraph: Studio medico · Lugano
  - heading "Terapia del Dolore, Agopuntura e Laserterapia a Lugano" [level=1]
  - paragraph: "Swiss Centro Medico è lo studio del Dott. Zeljko Djordjevic a Lugano: trattamenti personalizzati per il dolore cronico con reumatologia, laserterapia, agopuntura e medicina rigenerativa. Ogni percorso nasce da una valutazione specialistica approfondita."
  - link "Prenota online":
    - /url: /prenota/
  - link "Chiama lo studio":
    - /url: tel:+41919210427
  - img "Certificazione RME"
  - paragraph:
    - text: Certificati
    - strong: RME
    - text: ": a determinate condizioni i trattamenti sono rimborsabili dalle assicurazioni complementari. Per l'agopuntura riconosciuto anche da"
    - strong: Visana
    - text: ", con rimborso secondo la complementare del paziente."
  - img "Dott. Zeljko Djordjevic nel suo studio a Lugano"
  - paragraph: Dott. med. univ. Zeljko Djordjevic
  - paragraph: Specialista in Medicina fisica e riabilitazione FMH · Medicina manuale · Agopuntura MTC
  - region "Studio medico · Lugano":
    - list:
      - listitem:
        - paragraph:
          - strong: FMH
          - text: Medicina fisica e riabilitazione
      - listitem:
