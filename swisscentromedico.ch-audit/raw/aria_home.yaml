    - paragraph: Lo studio è in posizione centrale nella Svizzera italiana, raggiungibile anche da Mendrisio, Bellinzona, Locarno e Chiasso, e comodamente raggiungibile dall'Italia, da Milano, Como, Varese e dalla Lombardia, in auto e in treno.
