  - region "Aree di specializzazione":
    - heading "Aree di specializzazione" [level=2]
    - heading "01 · Agopuntura" [level=3]
    - paragraph: Agopuntura eseguita da medico specialista, con diagnosi occidentale e valutazione secondo la medicina tradizionale cinese.
    - list:
      - listitem: Dolore cronico, cefalee, disturbi articolari e funzionali
      - listitem: Agopuntura classica, addominale, auricolare RAC e laser
      - listitem: Qualifica in agopuntura e farmacoterapia cinese (ASA)
      - listitem: Aghi sterili monouso, o laserneedle senza puntura
    - paragraph:
      - link "Agopuntura a Lugano →":
        - /url: /agopuntura/
    - heading "02 · Reumatologia" [level=3]
    - paragraph: Diagnosi e cura delle malattie che colpiscono colonna vertebrale, muscoli, articolazioni e ossa.
    - list:
      - listitem: Malattie infiammatorie articolari e spinali
      - listitem: Malattie degenerative come l'osteoartrite
      - listitem: Ernia del disco, scoliosi, colpo di frusta
      - listitem: Riabilitazione post-operatoria e secondi pareri
    - paragraph:
      - link "Reumatologia a Lugano →":
        - /url: /reumatologo/
    - heading "03 · Terapia del dolore" [level=3]
    - paragraph: Diagnosi e trattamento interventistico del dolore.
    - list:
      - listitem: Puntura e infiltrazione di tessuti molli e articolazioni
      - listitem: Infiltrazione spinale per ernie e stenosi
      - listitem: Guida ecografica muscolo-scheletrica
      - listitem: Insieme a medicina manuale e percorso reumatologico, quando serve
    - paragraph:
      - link "Terapia del dolore →":
        - /url: /terapia-interventistica-del-dolore/
  - region "Trattamenti":
    - heading "Trattamenti" [level=2]
    - link "Tutti i trattamenti ↓":
      - /url: "#home-index"
    - img "Agopuntura"
    - heading "Agopuntura e MTC →" [level=3]:
      - link "Agopuntura e MTC →":
        - /url: /agopuntura/
    - paragraph: Medicina tradizionale cinese e auricolomedicina per un'ampia gamma di disturbi, con aghi o laser.
    - img "Diagnostica"
    - heading "Laserterapia invasiva →" [level=3]:
      - link "Laserterapia invasiva →":
        - /url: /laserterapia/
    - paragraph: Azione precisa e profonda su patologie croniche, lesioni tendinee e disturbi resistenti alle terapie conservative.
    - img "Terapia del dolore"
    - heading "Terapia interventistica del dolore →" [level=3]:
      - link "Terapia interventistica del dolore →":
        - /url: /terapia-interventistica-del-dolore/
    - paragraph: Infiltrazioni articolari e spinali per ernie del disco e stenosi, eseguite sotto guida ecografica.
    - img "Ecografia"
    - heading "Ecografia muscolo-scheletrica →" [level=3]:
      - link "Ecografia muscolo-scheletrica →":
        - /url: /ecografia-muscolo-scheletrica/
    - paragraph: Diagnostica per immagini in sede, con laboratorio interno e partner esterno per referti rapidi.
    - img "Medicina manuale"
    - heading "Medicina manuale →" [level=3]:
      - link "Medicina manuale →":
        - /url: /medicina-manuale/
    - paragraph: Metodo ortopedico conservativo per i disturbi funzionali dolorosi dell'apparato muscolo-scheletrico.
    - img "Diagnostica"
    - heading "Agopuntura laser non invasiva →" [level=3]:
      - link "Agopuntura laser non invasiva →":
        - /url: /laserterapia-locale-non-invasiva-e-lagopuntura/
    - paragraph: Indicata nell'osteoartrite avanzata e nel recupero rapido dopo intervento artroscopico.
