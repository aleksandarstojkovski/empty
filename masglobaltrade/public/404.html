<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Pagina non trovata | MAS Global Trade</title>
    <meta
      name="description"
      content="La pagina richiesta non è disponibile. Torna alla homepage o richiedi una valutazione gratuita della tua auto."
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8fa;
        color: #0d2244;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 64px);
        text-align: center;
        background: #fff;
        border: 1px solid #e3e8ef;
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(13, 34, 68, 0.1);
      }
      .code {
        margin: 0 0 12px;
        color: #00aee8;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 56px);
        line-height: 1.08;
      }
      p {
        max-width: 500px;
        margin: 20px auto 30px;
        color: #536174;
        font-size: 18px;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border: 2px solid #0d2244;
        border-radius: 999px;
        color: #0d2244;
        font-weight: 800;
        text-decoration: none;
      }
      a.primary {
        border-color: #0d2244;
        background: #0d2244;
        color: #fff;
      }
      a:focus-visible {
        outline: 3px solid #00aee8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERRORE 404</p>
      <h1>Questa pagina non è disponibile</h1>
      <p>
        Il contenuto potrebbe essere stato spostato o rimosso. Puoi tornare alla
        homepage oppure richiedere subito una valutazione gratuita della tua auto.
      </p>
      <nav aria-label="Link utili">
        <a href="/">Torna alla homepage</a>
        <a class="primary" href="/valutazione-gratuita">Valutazione gratuita</a>
      </nav>
    </main>
  </body>
</html>
